name: Unzip site
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          unzip -o mathA-site.zip -d .
          rm mathA-site.zip
          for f in */*.html; do [ -e "$f" ] && mv "$f" .; done
          rmdir */ 2>/dev/null || true
          rm -rf .github
          git config user.name "hddbjdscjy"
          git config user.email "hddbjdscjy@users.noreply.github.com"
          git add -A
          git commit -m "Extract mathA site files" || echo "nothing to commit"
          git push
